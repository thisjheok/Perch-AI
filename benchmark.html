<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perch Runtime Benchmark</title>
  </head>
  <body>
    <main>
      <p><a href="/">예제 홈</a></p>
      <h1>WASM / WebGPU 벤치마크</h1>
      <p>같은 MobileNetV2 모델과 입력으로 전처리, cold/warm 초기화, 추론을 분리 측정합니다. cold 초기화 전 SDK Cache API에서 이 모델의 항목만 지웁니다. 브라우저 HTTP 캐시는 지우지 않습니다.</p>
      <label>
        입력 이미지
        <input id="image-file" type="file" accept="image/*" />
      </label>
      <label>
        추론 반복 횟수 (라운드당, warm-up 이후)
        <input id="iterations" type="number" min="5" max="100" value="30" />
      </label>
      <label>
        측정 라운드 (런타임 순서를 교차합니다)
        <input id="trials" type="number" min="2" max="5" value="3" />
      </label>
      <button id="run-benchmark" disabled>벤치마크 실행</button>
      <p id="status">이미지를 선택하세요.</p>
      <pre id="results"></pre>
      <button id="download-report" hidden>JSON 결과 다운로드</button>
    </main>
    <script type="module" src="/src/benchmark.ts"></script>
  </body>
</html>
