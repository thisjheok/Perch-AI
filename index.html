<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perch Local AI Example</title>
  </head>
  <body>
    <main>
      <h1>Perch Local AI</h1>
      <p>MobileNetV2를 브라우저에서 직접 실행하는 예제입니다.</p>

      <label>
        Manifest URL
        <input id="manifest-url" value="/models/mobilenetv2/manifest.json" />
      </label>
      <button id="load">모델 로드</button>
      <p id="status">모델을 로드하지 않았습니다.</p>

      <div id="drop-zone" class="drop-zone">
        이미지를 여기에 드래그하거나
        <label>
          파일 선택
          <input id="image-file" type="file" accept="image/*" />
        </label>
      </div>
      <img id="preview" alt="선택한 이미지 미리보기" hidden />
      <button id="run" disabled>이미지 분류</button>
      <pre id="output"></pre>

      <hr />
      <h2>간단한 대화 LM</h2>
      <p>대화 기록을 유지하지 않는 FLAN-T5 질답 예제입니다.</p>
      <button id="load-lm">LM 로드</button>
      <p id="lm-status">LM을 로드하지 않았습니다.</p>
      <textarea id="prompt" rows="4" placeholder="Ask something in English..."></textarea>
      <button id="ask-lm" disabled>질문하기</button>
      <pre id="lm-output"></pre>
    </main>
    <script type="module" src="/src/example.ts"></script>
  </body>
</html>
